<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        canvas {
            border: 1px solid black;
        }
    </style>
</head>
<body>

    <h1>Snake</h1>
    <canvas id="gameCanvas" width="400"
            height="400"></canvas>
    <p id="info"></p>

    <script>
        // ===== GAME SETUP =====
        const canvas =
            document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const gridSize = 20;
        const tileCount = canvas.width / gridSize;
        // ===== INITIAL STATE =====
        let snake = [
            { x: 10, y: 10 },
            { x: 9, y: 10 },
            { x: 8, y: 10 }
        ];
        let direction = { x: 1, y: 0 };
        let food = { x: 15, y: 15 };
        let score = 0;
        

        // ===== DRAWING =====
        const drawGame = () => {
            ctx.clearRect(0, 0,
                canvas.width, canvas.height);

            ctx.fillStyle = "red";
            ctx.fillRect(
                food.x * gridSize,
                food.y * gridSize,
                gridSize, gridSize
            );

            ctx.fillStyle = "black";
            for (const segment of snake) {
                ctx.fillRect(
                    segment.x * gridSize,
                    segment.y * gridSize,
                    gridSize, gridSize
                );
            }
        };

        const allSpots = [];
            for (let x = 0; x < tileCount; x++) {
                for (let y = 0; y < tileCount; y++) allSpots.push({ x, y });
        }
       
        let availableSpots = allSpots.filter(spot =>
            !snake.some(segment =>
                segment.x === spot.x && segment.y === spot.y
             )
        );

        const movementTick = () => {
            snake.unshift({ x: snake[0].x + direction.x, y: snake[0].y + direction.y });
            
             if (!(snake[0].x == food.x && snake[0].y == food.y)) {
                snake.pop();
             }
            
             if (snake[0].x == food.x && snake[0].y == food.y) {
                availableSpots = allSpots.filter(spot =>
                    !snake.some(segment =>
                        segment.x === spot.x && segment.y === spot.y
                        )
                 );
                food = availableSpots[Math.floor(Math.random()*availableSpots.length)]
                score++;     
             }
            drawGame();
        }

        document.addEventListener("keydown", (event) => {
            if ((event.key) == "ArrowUp") {
                direction = { x: 0, y: -1 }
            };
            if ((event.key) == "ArrowDown") {
                direction = { x: 0, y: 1 }
            };
            if ((event.key) == "ArrowRight") {
                direction = { x: 1, y: 0 }
            };
            if ((event.key) == "ArrowLeft") {
                direction = { x: -1, y: 0 }
            };
        });
        
        
        setInterval(movementTick, 200) 
        
        
        

        // ===================================
        // BUILD THE GAME FROM HERE
        // ===================================
        //
        // Use your custom agent in VS Code Chat 
        // to guide your work through each step. 
        // Commit regularly.
        //
        // Step 1: Movement (game loop)
        // Step 2: Keyboard controls (arrow keys)
        // Step 3: Eating and growing
        // Step 4: Game over
        // Step 5: Improvements
        //
        // ===================================

    </script>

</body>
</html>
