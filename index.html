<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1 id="gameTitle">Snake</h1>
    <canvas id="gameCanvas" width="400"
            height="400"></canvas>
    <p id="info">Score: 0</p>
    <button hidden id="playAgain">Play again</button>
    
    <script>
        // ===== GAME SETUP =====
        const canvas =
            document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const gridSize = 20;
        const tileCount = canvas.width / gridSize;
        // ===== INITIAL STATE =====
        let snake = [
            { x: 10, y: 10 },
            { x: 9, y: 10 },
            { x: 8, y: 10 }
        ];
        let direction = { x: 1, y: 0 };
        let food = { x: 15, y: 15 };
        let score = 0;
        

        // ===== DRAWING =====
        const drawGame = () => {
            ctx.clearRect(0, 0,
                canvas.width, canvas.height);

            ctx.fillStyle = "red";
            ctx.fillRect(
                food.x * gridSize,
                food.y * gridSize,
                gridSize, gridSize
            );

            ctx.fillStyle = "black";
            for (const segment of snake) {
                ctx.fillRect(
                    segment.x * gridSize,
                    segment.y * gridSize,
                    gridSize, gridSize
                );
            }
        };
        
        let playing = true

        const allSpots = [];
            for (let x = 0; x < tileCount; x++) {
                for (let y = 0; y < tileCount; y++) allSpots.push({ x, y });
        }
       
        let availableSpots = allSpots.filter(spot =>
            !snake.some(segment =>
                segment.x === spot.x && segment.y === spot.y
             )
        );

        let movementQueue = []

        const movementTick = () => {
            if (playing) {
             if (movementQueue.length > 0) {
                direction = movementQueue.shift();
            }   
             snake.unshift({ x: snake[0].x + direction.x, y: snake[0].y + direction.y }); // New snake Head
             if (snake.slice(1).some(segment => segment.x === snake[0].x && segment.y === snake[0].y) || // Self collision / Wall collision
             snake[0].x < 0 || snake[0].x >= tileCount || snake[0].y < 0 || snake[0].y >= tileCount) {
                console.log("Game Over!")
                playing = false
             }           
             if (!(snake[0].x == food.x && snake[0].y == food.y)) { // Snake grows if head on food
                snake.pop();
             }
            
             if (snake[0].x == food.x && snake[0].y == food.y) { // Check available spots for food generation when collected
                availableSpots = allSpots.filter(spot =>
                    !snake.some(segment =>
                        segment.x === spot.x && segment.y === spot.y )
                 );
                food = availableSpots[Math.floor(Math.random()*availableSpots.length)]
                score++;
                document.getElementById("info").textContent = `Score: ${score}`;
             }

             let newDelay = Math.max(200 - Math.floor(score / 10) * 25, 50);
             clearInterval(gameTimer);
             gameTimer = setInterval(movementTick, newDelay);

             if (availableSpots.length === 0) {
                playing = false;
                document.getElementById("info").textContent = `Score: ${score}\nYou Win!`;} 

             else if(playing) {drawGame();}

             else {document.getElementById("info").textContent = `Score: ${score}\nGame Over!`;
                document.getElementById("playAgain").hidden = false
             }
            }
        }

        document.addEventListener("keydown", (event) => { // Movement, don't allow 180 degree turn
            let lastDirection = movementQueue[movementQueue.length - 1] ?? direction;
            if (event.key === "ArrowUp" && lastDirection.y !== 1) {
                movementQueue.push({ x: 0, y: -1 });
            };
            if (event.key === "ArrowDown" && lastDirection.y !== -1) {
                movementQueue.push({ x: 0, y: 1 });
            };
            if ((event.key) == "ArrowRight" && lastDirection.x !== -1) {
                movementQueue.push({ x: 1, y: 0 });
            };
            if ((event.key) == "ArrowLeft" && lastDirection.x !== 1) {
                movementQueue.push({ x: -1, y: 0 });
            };
        });
        

        document.getElementById("playAgain").addEventListener("click", () => {
            snake = [
                { x: 10, y: 10 },
                { x: 9, y: 10 },
                { x: 8, y: 10 }
            ];
            direction = { x: 1, y: 0 };
            food = { x: 15, y: 15 };
            score = 0;
            playing = true;
            document.getElementById("info").textContent = `Score: ${score}`;
            document.getElementById("playAgain").hidden = true
            movementQueue = []
            drawGame();

        
        });

        let gameTimer = setInterval(movementTick, 200);
             
    </script>

</body>
</html>
