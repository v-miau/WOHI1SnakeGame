<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <style>
        canvas {
            border: 1px solid black;
        }
        #info {
            white-space: pre-line;
        }
    </style>
</head>
<body>

    <h1>Snake</h1>
    <canvas id="gameCanvas" width="400"
            height="400"></canvas>
    <p id="info">Score: 0</p>

    <script>
        // ===== GAME SETUP =====
        const canvas =
            document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const gridSize = 20;
        const tileCount = canvas.width / gridSize;
        // ===== INITIAL STATE =====
        let snake = [
            { x: 10, y: 10 },
            { x: 9, y: 10 },
            { x: 8, y: 10 }
        ];
        let direction = { x: 1, y: 0 };
        let food = { x: 15, y: 15 };
        let score = 0;
        

        // ===== DRAWING =====
        const drawGame = () => {
            ctx.clearRect(0, 0,
                canvas.width, canvas.height);

            ctx.fillStyle = "red";
            ctx.fillRect(
                food.x * gridSize,
                food.y * gridSize,
                gridSize, gridSize
            );

            ctx.fillStyle = "black";
            for (const segment of snake) {
                ctx.fillRect(
                    segment.x * gridSize,
                    segment.y * gridSize,
                    gridSize, gridSize
                );
            }
        };
        
        let playing = true

        const allSpots = [];
            for (let x = 0; x < tileCount; x++) {
                for (let y = 0; y < tileCount; y++) allSpots.push({ x, y });
        }
       
        let availableSpots = allSpots.filter(spot =>
            !snake.some(segment =>
                segment.x === spot.x && segment.y === spot.y
             )
        );

        const movementTick = () => {
            if (playing) {
             snake.unshift({ x: snake[0].x + direction.x, y: snake[0].y + direction.y }); // New snake Head

             if (snake.slice(1).some(segment => segment.x === snake[0].x && segment.y === snake[0].y) || // Self collision / Wall collision
             snake[0].x < 0 || snake[0].x >= gridSize || snake[0].y < 0 || snake[0].y >= tileCount) {
                console.log("Game Over!")
                playing = false
             }           
             if (!(snake[0].x == food.x && snake[0].y == food.y)) { // Snake grows if head on food
                snake.pop();
             }
            
             if (snake[0].x == food.x && snake[0].y == food.y) { // Check available spots for food generation when collected
                availableSpots = allSpots.filter(spot =>
                    !snake.some(segment =>
                        segment.x === spot.x && segment.y === spot.y
                        )
                 );
                food = availableSpots[Math.floor(Math.random()*availableSpots.length)]
                score++;
                document.getElementById("info").textContent = `Score: ${score}`;
             }
             if (availableSpots.length === 0) {
                playing = false;
                document.getElementById("info").textContent = `Score: ${score}\nYou Win!`;} 

             else if(playing) {drawGame();}

             else {document.getElementById("info").textContent = `Score: ${score}\nGame Over!`;}
            }
        }

        document.addEventListener("keydown", (event) => { // Movement, don't allowed 180 degree turn
            if (event.key === "ArrowUp" && direction.y !== 1) {
                 direction = { x: 0, y: -1 };
            };
            if (event.key === "ArrowDown" && direction.y !== -1) {
                direction = { x: 0, y: 1 }
            };
            if ((event.key) == "ArrowRight" && direction.x !== -1 ) {
                direction = { x: 1, y: 0 }
            };
            if ((event.key) == "ArrowLeft" && direction.x !== 1 ) {
                direction = { x: -1, y: 0 }
            };
        });
        

        setInterval(movementTick, 200)
       

        // ===================================
        // BUILD THE GAME FROM HERE
        // ===================================
        //
        // Use your custom agent in VS Code Chat 
        // to guide your work through each step. 
        // Commit regularly.
        //
        // Step 1: Movement (game loop)
        // Step 2: Keyboard controls (arrow keys)
        // Step 3: Eating and growing
        // Step 4: Game over
        // Step 5: Improvements
        //
        // ===================================

    </script>

</body>
</html>
